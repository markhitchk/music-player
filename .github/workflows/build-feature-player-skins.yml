name: Build Player Skins APK

on:
  push:
    branches:
      - feature/player-skins
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run player skin unit tests
        run: ./gradlew :app:testModernNowearDebugUnitTest --stacktrace

      - name: Build modern debug APK
        run: ./gradlew :app:lite:assembleModernNowearDebug --stacktrace

      - name: Collect APK
        run: |
          mkdir -p apk-output
          find app/lite/build/outputs/apk -type f -name '*.apk' -exec cp {} apk-output/Music-Player-Player-Skins-Debug.apk \;
          test -f apk-output/Music-Player-Player-Skins-Debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: music-player-player-skins-apk
          path: apk-output/Music-Player-Player-Skins-Debug.apk
          if-no-files-found: error
          retention-days: 14
